<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - O Barbeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --gold-1: #d4af37;
            --gold-2: #aa820a;
            --bg: #121212;
            --panel: #1e1e1e;
            --border: #333;
            --muted: #9a9a9a;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .app-shell {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            padding: 16px 14px 90px;
        }

        /* Botão flutuante topo direito */
        .pill-nav {
            position: sticky;
            top: 10px;
            float: right;
            background: #fff;
            color: #121212;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            border: none;
            border-radius: 999px;
            padding: 8px 14px;
            z-index: 20;
        }

        /* Logo */
        .brand-block { text-align: center; padding: 6px 0 18px; clear: both; }
        .brand-eyebrow {
            font-size: 0.65rem;
            letter-spacing: 0.35em;
            color: var(--gold-1);
            text-transform: uppercase;
        }
        .brand-name {
            font-family: Georgia, 'Times New Roman', serif;
            font-weight: 700;
            font-size: 2rem;
            background: linear-gradient(135deg, #f1d582 0%, var(--gold-1) 45%, var(--gold-2) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 0.04em;
        }
        .brand-rule {
            width: 90px;
            height: 2px;
            margin: 10px auto;
            background: linear-gradient(90deg, transparent, var(--gold-1), transparent);
        }

        /* Fluxo de chat */
        .chat-stream {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg {
            max-width: 86%;
            animation: rise 0.28s ease both;
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-bot {
            align-self: flex-start;
            background: linear-gradient(135deg, var(--gold-1) 0%, var(--gold-2) 100%);
            color: #121212;
            border-radius: 16px 16px 16px 4px;
            padding: 13px 15px;
            font-weight: 500;
            font-size: 0.92rem;
            line-height: 1.4;
        }
        .msg-user {
            align-self: flex-end;
            background: #3a3a3a;
            color: #fff;
            border-radius: 16px 16px 4px 16px;
            padding: 11px 15px;
            font-size: 0.88rem;
            font-weight: 500;
        }
        .msg-widget { align-self: stretch; max-width: 100%; }

        .step-label {
            text-transform: uppercase;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        /* Carrossel de serviços */
        .h-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 6px;
            scroll-snap-type: x proximity;
        }
        .h-scroll::-webkit-scrollbar { height: 5px; }
        .h-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        .service-card {
            flex: 0 0 148px;
            scroll-snap-align: start;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .service-card:hover, .service-card.selected {
            border-color: var(--gold-1);
        }
        .service-card.selected { box-shadow: 0 0 0 1px var(--gold-1) inset; }
        .service-thumb {
            height: 78px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.7rem;
            background: radial-gradient(circle at 30% 20%, #2c2c2c, #1a1a1a);
        }
        .service-body { padding: 10px 12px 12px; }
        .service-body h6 { font-size: 0.85rem; margin-bottom: 2px; }
        .service-price { color: var(--gold-1); font-size: 0.78rem; font-weight: 600; margin-bottom: 2px; }
        .service-dur { color: var(--muted); font-size: 0.7rem; }

        /* Dias */
        .day-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
        .day-pill {
            flex: 0 0 60px;
            text-align: center;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 4px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .day-pill .dow { font-size: 0.65rem; color: var(--muted); font-weight: 700; }
        .day-pill .num { font-size: 1.05rem; font-weight: 700; }
        .day-pill.selected { background: var(--gold-1); color: #121212; border-color: var(--gold-1); }
        .day-pill.selected .dow { color: #4a3a00; }
        .day-pill.disabled { opacity: 0.35; cursor: not-allowed; }
        .scroll-hint { font-size: 0.65rem; color: var(--muted); text-align: right; margin: 6px 2px 10px; }

        .time-slot {
            background-color: var(--panel);
            border: 1px solid var(--border);
            color: #fff;
            border-radius: 10px;
            padding: 10px 4px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.15s;
        }
        .time-slot:hover, .time-slot.selected {
            background: var(--gold-1);
            color: #121212;
            border-color: var(--gold-1);
        }

        .waitlist-box {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 14px;
            text-align: center;
            font-size: 0.85rem;
        }

        .selected-date-bar {
            background: #161616;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px;
            text-align: center;
            font-size: 0.78rem;
            font-weight: 600;
            margin: 12px 0;
        }

        .chat-input {
            width: 100%;
            background: #3a3a3a;
            border: 1px solid #4a4a4a;
            color: #fff;
            border-radius: 12px;
            padding: 13px 15px;
            font-size: 0.88rem;
        }
        .chat-input::placeholder { color: #b8a15f; }
        .chat-input:focus {
            outline: none;
            border-color: var(--gold-1);
            background: #333;
        }
        .chat-input.is-invalid { border-color: #b23a3a; }

        .btn-chat {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 700;
            font-size: 0.88rem;
        }
        .btn-chat-primary { background: #4a4a4a; color: #fff; }
        .btn-chat-primary:hover { background: #565656; color: #fff; }
        .btn-chat-primary:disabled { opacity: 0.45; }
        .btn-chat-ghost { background: transparent; color: #ccc; border: 1px solid var(--border); }
        .btn-gold { background: linear-gradient(135deg, var(--gold-1) 0%, var(--gold-2) 100%); color: #121212; }
        .btn-gold:hover { opacity: 0.92; color: #121212; }
        .btn-outline-gold { background: #fff; color: #121212; }
        .btn-change-user {
            align-self: center;
            width: auto !important;
            padding: 6px 16px !important;
            border-radius: 999px !important;
            margin-top: -4px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .btn-change-user:hover {
            opacity: 1;
        }

        .avatar-photo {
            width: 100%;
            aspect-ratio: 4/3;
            border-radius: 12px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            background: radial-gradient(circle at 30% 30%, #3a3a3a, #161616);
        }

        /* Tela Meus Agendamentos */
        #screen-appointments { display: none; }
        .back-arrow { font-size: 1.3rem; color: #ccc; cursor: pointer; }
        .apt-title-light { font-size: 1.1rem; color: #ccc; font-weight: 400; margin-bottom: 0; }
        .apt-title-bold { font-size: 2.2rem; font-weight: 800; margin-bottom: 20px; }
        .apt-card {
            background: #3d3d3d;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
        }
        .apt-cancel-btn {
            background: #b23a3a;
            color: #fff;
            border: none;
            border-radius: 999px;
            padding: 5px 14px;
            font-size: 0.72rem;
            font-weight: 700;
        }
        .apt-note {
            background: var(--panel);
            border-radius: 12px;
            padding: 16px;
            font-size: 0.8rem;
            text-align: center;
            color: #ccc;
            margin-bottom: 14px;
        }
        .apt-history-toggle {
            background: var(--panel);
            border: none;
            border-radius: 12px;
            width: 100%;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .apt-empty { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 30px 0; }

        .locked { pointer-events: none; opacity: 0.82; }
    </style>
</head>
<body>

    <div class="app-shell">

        <!-- TELA 1: CHAT DE AGENDAMENTO -->
        <div id="screen-chat">
            <button class="pill-nav" id="btn-go-appointments">MEUS AGENDAMENTOS</button>

            <div class="brand-block">
                <div class="brand-eyebrow">Barber Shop</div>
                <div class="brand-name">El-Shaday</div>
                <div class="brand-rule"></div>
            </div>

            <div class="chat-stream" id="chat-stream"></div>
        </div>

        <!-- TELA 2: MEUS AGENDAMENTOS -->
        <div id="screen-appointments">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <span class="back-arrow" id="btn-back-to-chat">&#8592;</span>
                <button class="pill-nav" style="float:none;">MEUS AGENDAMENTOS</button>
            </div>

            <p class="apt-title-light">Meus</p>
            <p class="apt-title-bold">Agendamentos</p>

            <div id="apt-current-wrap"></div>

            <div class="apt-note">
                Este estabelecimento permite cancelamentos com no mínimo <strong>5 min</strong> de antecedência.
            </div>

            <button class="apt-history-toggle" data-bs-toggle="collapse" data-bs-target="#apt-history">
                Histórico de agendamentos realizados
                <span>&#9662;</span>
            </button>
            <div class="collapse mt-2" id="apt-history">
                <div id="apt-history-list"></div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
