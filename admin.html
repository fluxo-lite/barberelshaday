<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Barbearia El-Shaday</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; }
        .admin-card { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .btn-gold { background: #d4af37; color: #121212; font-weight: bold; }
    </style>
</head>
<body class="p-3">
    <div class="container" style="max-width: 500px;">
        <h4 class="text-warning mb-3">Painel Administrativo</h4>

        <!-- Login -->
        <div id="login-section" class="admin-card">
            <label class="form-label">Senha do Administrador</label>
            <input type="password" id="admin-password" class="form-control mb-3" placeholder="Sua senha">
            <button class="btn btn-gold w-100" onclick="autenticar()">Acessar Painel</button>
        </div>

        <!-- Painel de Horários -->
        <div id="panel-section" style="display: none;">
            <div class="mb-3">
                <label class="form-label">Selecione a Data:</label>
                <input type="date" id="select-date" class="form-control" onchange="carregarData()">
            </div>
            <div id="slots-list"></div>
        </div>
    </div>

    <script>
        let adminPass = "";
        const ALL_SLOTS = ["09:55", "10:20", "14:00", "14:25", "14:50", "15:15", "15:40", "16:05", "16:30", "16:55", "17:20", "17:45", "18:10", "18:35", "19:00", "19:25", "19:50", "20:15", "20:40", "21:05"];

        function autenticar() {
            adminPass = document.getElementById('admin-password').value;
            if(!adminPass) return alert("Digite a senha");
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('panel-section').style.display = 'block';
            
            // Define data padrão como HOJE
            document.getElementById('select-date').value = new Date().toISOString().split('T')[0];
            carregarData();
        }

        async function carregarData() {
            const date = document.getElementById('select-date').value;
            const res = await fetch(`/api/horarios?date=${date}`);
            const data = await res.json();
            const ocupados = data.ocupados || [];

            const container = document.getElementById('slots-list');
            container.innerHTML = ALL_SLOTS.map(slot => {
                const isOcupado = ocupados.includes(slot);
                return `
                    <div class="admin-card d-flex justify-content-between align-items-center">
                        <span><strong>${slot}</strong> - ${isOcupado ? '❌ Ocupado / Indisponível' : '✅ Livre'}</span>
                        <button class="btn btn-sm ${isOcupado ? 'btn-success' : 'btn-danger'}" 
                                onclick="toggleSlot('${date}', '${slot}', ${isOcupado})">
                            ${isOcupado ? 'Ativar' : 'Desativar'}
                        </button>
                    </div>
                `;
            }).join('');
        }

        async function toggleSlot(data, hora, isOcupado) {
            const acao = isOcupado ? 'desbloquear' : 'bloquear';
            const res = await fetch('/api/horarios', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': adminPass 
                },
                body: JSON.stringify({ data, hora, acao })
            });

            if(res.ok) {
                carregarData();
            } else {
                alert('Erro ou Senha incorreta!');
            }
        }
    </script>
</body>
</html>
